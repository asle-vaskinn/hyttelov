name: Bygg

# Sjekker at bestemmelsene bygger (henvisninger, struktur, status).
# Publisering skjer i Permen, som henter repoet og bygger selv.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # hele historikken trengs for endringsloggen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python bygg/bygg.py _site --kilde "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bestemmelser
          path: _site
